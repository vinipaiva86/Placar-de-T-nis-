<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placar de Tênis - W69+</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #121212; color: white; padding: 20px; }
        .score-board { display: flex; justify-content: space-around; margin-top: 30px; }
        .player-box { background: #222; padding: 15px; border-radius: 10px; width: 42%; }
        .points { font-size: 3.5rem; font-weight: bold; color: #00ffcc; }
        .games { font-size: 1.1rem; color: #aaa; margin-top: 5px; }
        button { padding: 15px 20px; font-size: 1.1rem; margin-top: 25px; cursor: pointer; border-radius: 8px; border: none; background: #00ffcc; color: #121212; font-weight: bold; width: 100%; max-width: 300px; }
        .status { margin-top: 15px; font-size: 0.9rem; color: #00ffcc; }
    </style>
</head>
<body>

    <h2>🎾 Placar de Tênis - W69+</h2>
    
    <div class="score-board">
        <div class="player-box">
            <h3>Você (⏭️ Próx)</h3>
            <div class="points" id="p1-score">0</div>
            <div class="games" id="p1-games">Games: 0</div>
        </div>
        <div class="player-box">
            <h3>Adversário (⏮️ Ant)</h3>
            <div class="points" id="p2-score">0</div>
            <div class="games" id="p2-games">Games: 0</div>
        </div>
    </div>

    <!-- Elemento de áudio invisível para forçar o foco real de mídia no Android -->
    <audio id="dummy-audio" loop src="https://actions.google.com/sounds/v1/ambiences/rain_heavy.ogg" style="display:none;"></audio>

    <button onclick="ativarControle()">CONECTAR CONTROLE DO RELÓGIO</button>
    <div class="status" id="status-msg">Toque para assumir o controle dos botões.</div>

    <script>
        let scoreState = { p1Pts: 0, p2Pts: 0, p1Games: 0, p2Games: 0 };
        const scoreLabels = ["0", "15", "30", "40"];

        function falar(texto) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let msg = new SpeechSynthesisUtterance(texto);
                msg.lang = 'pt-BR';
                window.speechSynthesis.speak(msg);
            }
        }

        function pontoVoce() {
            if (scoreState.p1Pts < 3) {
                scoreState.p1Pts++;
            } else {
                scoreState.p1Pts = 0; scoreState.p2Pts = 0;
                scoreState.p1Games++;
                falar("Game seu!");
                atualizarTela();
                return;
            }
            falarPlacar();
            atualizarTela();
        }

        function pontoAdversario() {
            if (scoreState.p2Pts < 3) {
                scoreState.p2Pts++;
            } else {
                scoreState.p1Pts = 0; scoreState.p2Pts = 0;
                scoreState.p2Games++;
                falar("Game do adversário!");
                atualizarTela();
                return;
            }
            falarPlacar();
            atualizarTela();
        }

        function falarPlacar() {
            let p1 = scoreLabels[scoreState.p1Pts];
            let p2 = scoreLabels[scoreState.p2Pts];
            falar(`${p1} a ${p2}`);
        }

        function atualizarTela() {
            document.getElementById('p1-score').innerText = scoreLabels[scoreState.p1Pts];
            document.getElementById('p2-score').innerText = scoreLabels[scoreState.p2Pts];
            document.getElementById('p1-games').innerText = `Games: ${scoreState.p1Games}`;
            document.getElementById('p2-games').innerText = `Games: ${scoreState.p2Games}`;
        }

        function ativarControle() {
            const audioElement = document.getElementById('dummy-audio');
            
            // Força o play no elemento de áudio real para o Android registrar que ESTA aba está ditando a mídia
            audioElement.play().then(() => {
                if ('mediaSession' in navigator) {
                    navigator.mediaSession.metadata = new MediaMetadata({
                        title: '🎾 Placar: 0 a 0',
                        artist: 'Use os botões para pontuar',
                        album: 'W69+ Tennis Controller'
                    });

                    navigator.mediaSession.setActionHandler('nexttrack', () => {
                        pontoVoce();
                        atualizarMetadataMedia();
                    });
                    navigator.mediaSession.setActionHandler('previoustrack', () => {
                        pontoAdversario();
                        atualizarMetadataMedia();
                    });
                    navigator.mediaSession.setActionHandler('pause', () => falarPlacar());
                    navigator.mediaSession.setActionHandler('play', () => falarPlacar());

                    document.getElementById('status-msg').innerText = "🟢 Controle ativado! O YouTube Music foi sobrescrito.";
                    falar("Controle do relógio ativado.");
                }
            }).catch(e => {
                document.getElementById('status-msg').innerText = "Erro ao dar play no áudio. Tente novamente.";
            });
        }

        function atualizarMetadataMedia() {
            if ('mediaSession' in navigator) {
                let p1 = scoreLabels[scoreState.p1Pts];
                let p2 = scoreLabels[scoreState.p2Pts];
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: `🎾 ${p1} x ${p2} (G: ${scoreState.p1Games}-${scoreState.p2Games})`,
                    artist: 'Próx = Você | Ant = Adversário',
                    album: 'W69+ Tennis Controller'
                });
            }
        }
    </script>
</body>
</html>
