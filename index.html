<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placar de Tênis - W69+</title>
    <style>
        body { font-family: sans-serif; text-align: center; background: #121212; color: white; padding: 20px; }
        .score-board { display: flex; justify-content: space-around; margin-top: 30px; }
        .player-box { background: #222; padding: 15px; border-radius: 10px; width: 42%; }
        .points { font-size: 3.5rem; font-weight: bold; color: #00ffcc; }
        .games { font-size: 1.1rem; color: #aaa; margin-top: 5px; }
        button { padding: 15px 20px; font-size: 1.1rem; margin-top: 25px; cursor: pointer; border-radius: 8px; border: none; background: #00ffcc; color: #121212; font-weight: bold; width: 100%; max-width: 300px; }
        .status { margin-top: 15px; font-size: 0.9rem; color: #00ffcc; }
    </style>
</head>
<body>

    <h2>🎾 Placar de Tênis - W69+</h2>
    
    <div class="score-board">
        <div class="player-box">
            <h3>Você (⏭️)</h3>
            <div class="points" id="p1-score">0</div>
            <div class="games" id="p1-games">Games: 0</div>
        </div>
        <div class="player-box">
            <h3>Adversário (⏮️)</h3>
            <div class="points" id="p2-score">0</div>
            <div class="games" id="p2-games">Games: 0</div>
        </div>
    </div>

    <button onclick="iniciarConexao()">ATIVAR CONTROLE DO RELÓGIO</button>
    <div class="status" id="status-msg">Toque para sequestrar o player de mídia.</div>

    <script>
        let scoreState = { p1Pts: 0, p2Pts: 0, p1Games: 0, p2Games: 0 };
        const scoreLabels = ["0", "15", "30", "40"];

        function falar(texto) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                let msg = new SpeechSynthesisUtterance(texto);
                msg.lang = 'pt-BR';
                window.speechSynthesis.speak(msg);
            }
        }

        function pontoVoce() {
            if (scoreState.p1Pts < 3) {
                scoreState.p1Pts++;
            } else {
                scoreState.p1Pts = 0; scoreState.p2Pts = 0;
                scoreState.p1Games++;
                falar("Game seu!");
                atualizarTela();
                return;
            }
            falarPlacar();
            atualizarTela();
        }

        function pontoAdversario() {
            if (scoreState.p2Pts < 3) {
                scoreState.p2Pts++;
            } else {
                scoreState.p1Pts = 0; scoreState.p2Pts = 0;
                scoreState.p2Games++;
                falar("Game do adversário!");
                atualizarTela();
                return;
            }
            falarPlacar();
            atualizarTela();
        }

        function falarPlacar() {
            let p1 = scoreLabels[scoreState.p1Pts];
            let p2 = scoreLabels[scoreState.p2Pts];
            falar(`${p1} a ${p2}`);
        }

        function atualizarTela() {
            document.getElementById('p1-score').innerText = scoreLabels[scoreState.p1Pts];
            document.getElementById('p2-score').innerText = scoreLabels[scoreState.p2Pts];
            document.getElementById('p1-games').innerText = `Games: ${scoreState.p1Games}`;
            document.getElementById('p2-games').innerText = `Games: ${scoreState.p2Games}`;
        }

        function iniciarConexao() {
            // Cria um contexto de áudio real do navegador para forçar o Android a focar nesta aba
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            // Cria um oscilador inaudível de baixo ganho apenas para manter o stream de áudio ativo
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            gainNode.gain.value = 0.001; // Quase mudo, mas tecnicamente som gerado
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);
            oscillator.start();

            if ('mediaSession' in navigator) {
                navigator.mediaSession.metadata = new MediaMetadata({
                    title: 'Placar de Tênis Ativo',
                    artist: 'Você (Próx) vs Adversário (Ant)',
                    album: 'W69+ Controller'
                });

                navigator.mediaSession.setActionHandler('nexttrack', () => pontoVoce());
                navigator.mediaSession.setActionHandler('previoustrack', () => pontoAdversario());
                navigator.mediaSession.setActionHandler('pause', () => falarPlacar());
                navigator.mediaSession.setActionHandler('play', () => falarPlacar());

                document.getElementById('status-msg').innerText = "🟢 Conectado e com foco de áudio sequestrado!";
                falar("Controle ativado com sucesso.");
            } else {
                document.getElementById('status-msg').innerText = "Erro: MediaSession não suportada.";
            }
        }
    </script>
</body>
</html>
